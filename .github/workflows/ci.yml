# Every push and pull request: the wallet (next/) and the server (server/) are checked separately.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet:
    name: Wallet — types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next/package-lock.json
      # npm ci fails when package-lock.json does not match package.json
      - run: npm ci
      - name: Lockfile unchanged
        run: git diff --exit-code package-lock.json
      - name: Audit (production dependencies, high and up)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (PWA)
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          SERVER_URL: /
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-pwa
          path: next/dist/pwa
          retention-days: 14

  e2e:
    name: Wallet — end to end and accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (the testnet test runs only when the secret is set)
        run: npm run e2e
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          TESTNET_MNEMONIC: ${{ secrets.TESTNET_MNEMONIC }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: next/playwright-report
          retention-days: 14

  server:
    name: Server — types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Lockfile unchanged
        run: git diff --exit-code package-lock.json
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Docker image builds
        run: docker build -t blackvault-server:ci .
