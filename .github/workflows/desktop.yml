# The desktop app (Electron): Actions › Desktop › Run workflow, or push a tag v2.2.0.
# Builds the installers on Windows, macOS and Linux and puts them in a draft GitHub Release
# for the version in next/package.json. Publishing that draft makes it the update every
# installed app picks up (electron-updater). See docs/DESKTOP.md.
#
# Variables (Settings › Environments › production): WALLETCONNECT_PROJECT_ID, as for Deploy.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # the draft release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # one draft for all three builds: left to themselves they each create one at the same moment.
  # Publishing the draft pushes its tag, which starts this workflow again: then there is nothing to do.
  release:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.draft.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./next/package.json').version")
          draft=$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "v$v is already published: nothing to build"
            echo build=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$draft" = none ]; then
            gh release create "v$v" --draft --title "$v" --notes "" --target "$GITHUB_SHA"
          fi
          echo build=true >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            next/package-lock.json
            next/src-electron/package-lock.json

      - name: Install
        working-directory: next
        run: |
          npm ci
          npm ci --prefix src-electron

      - name: Test
        working-directory: next
        run: npm test

      - name: Build and upload to the draft release
        working-directory: next
        run: npx quasar build -m electron --publish always
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          SERVER_URL: /
          WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no code-signing certificate yet: Windows SmartScreen and macOS Gatekeeper warn (docs/DESKTOP.md)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
