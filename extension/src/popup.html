<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BlackVault</title>
    <style>
        :root { color-scheme: dark }
        body { margin: 0; width: 300px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b0b0c; color: #f2f2f2 }
        main { padding: 18px }
        h1 { font-size: 17px; margin: 0 0 6px }
        p { margin: 0 0 12px; color: #b9b9be }
        a.btn { display: block; text-align: center; padding: 10px; border-radius: 10px; background: #6ee7b7; color: #0b0b0c; font-weight: 700; text-decoration: none }
        a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px }
        small { display: block; margin-top: 12px; color: #85858c }
    </style>
</head>
<body>
    <main>
        <h1>BlackVault is ready</h1>
        <p>On a VeChain site, choose the Sync2 or VeChain wallet option: BlackVault opens to sign in and to sign. You sign or decline there; the extension never sees your keys.</p>
        <a class="btn" href="https://wallet.blackvemarket.com" target="_blank" rel="noopener">Open BlackVault</a>
        <small>Another VeChain wallet extension takes precedence where both are installed.</small>
    </main>
</body>
</html>
